<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestion Inmobiliaria Duroc </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
        .login-image {
            background: linear-gradient(135deg, #f08800b0 0%, #000000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 40px;
        }
        .login-form {
            padding: 40px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-outline-primary {
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-outline-primary:hover {
            background: #667eea;
            color: white;
        }
        .nav-tabs {
            border: none;
            margin-bottom: 30px;
        }
        .nav-tabs .nav-link {
            border: none;
            color: #666;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 10px;
        }
        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container p-4">
        <div class="login-container">
            <div class="row g-0">
                <div class="col-lg-5 login-image d-none d-lg-flex flex-column">
                    <div class="text-center">
                        <i class="bi bi-house-door-fill" style="font-size: 4rem;"></i>
                        <h3 class="mt-3 fw-bold">Inmobiliarias Duroc</h3>
                        <p class="mb-0">Tu hogar ideal está aquí y en Duroc</p>
                    </div>
                </div>
                <div class="col-lg-7 login-form">
                    <ul class="nav nav-tabs" id="authTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">
                                <i class="bi bi-person-plus me-2"></i>Registrarse
                            </button>
                        </li>
                    </ul>
                    
                    <div class="tab-content">
                        <!-- Login Form -->
                        <div class="tab-pane fade show active" id="login">
                            <div id="loginAlert" class="alert d-none mb-3"></div>
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="loginEmail" required placeholder="tu@email.com">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Contraseña</label>
                                    <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••">
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                                </button>
                            </form>
                            <div class="text-center mt-3">
                                <a href="../index.html" class="text-decoration-none text-muted">
                                    <i class="bi bi-arrow-left me-1"></i>Volver al inicio
                                </a>
                            </div>
                        </div>
                        
                        <!-- Register Form -->
                        <div class="tab-pane fade" id="register">
                            <div id="registerAlert" class="alert d-none mb-3"></div>
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Nombre Completo</label>
                                    <input type="text" class="form-control" id="registerName" required placeholder="Tu nombre">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="registerEmail" required placeholder="tu@email.com">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Contraseña</label>
                                    <input type="password" class="form-control" id="registerPassword" required placeholder="Mínimo 6 caracteres" minlength="6">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Confirmar Contraseña</label>
                                    <input type="password" class="form-control" id="registerConfirmPassword" required placeholder="••••••••">
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-person-plus me-2"></i>Crear Cuenta
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
