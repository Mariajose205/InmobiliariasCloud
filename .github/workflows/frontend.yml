name: Frontend - Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend-react/**'
  workflow_dispatch:

concurrency:
  group: frontend
  cancel-in-progress: true

jobs:
  build-push:
    name: Build y push de la imagen del frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend-react
          push: true
          build-args: |
            VITE_AZURE_CLIENT_ID=${{ vars.VITE_AZURE_CLIENT_ID }}
            VITE_AZURE_AUTHORITY=${{ vars.VITE_AZURE_AUTHORITY }}
            VITE_AZURE_REDIRECT_URI=${{ vars.VITE_AZURE_REDIRECT_URI }}
            VITE_AZURE_API_SCOPE=${{ vars.VITE_AZURE_API_SCOPE }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/inmobiliarias-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/inmobiliarias-frontend:${{ github.sha }}

      - name: Disparar deploy en el repo de infraestructura
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.everest+json" \
            "https://api.github.com/repos/$DEPLOY_REPO/dispatches" \
            -d '{"event_type":"deploy-frontend"}'
          echo "Deploy frontend disparado en $DEPLOY_REPO"