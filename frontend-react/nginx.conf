server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permite subir propiedades con imagenes grandes (default es 1MB).
    client_max_body_size 50m;

    # NO hay location /api/ aqui a proposito.
    #
    # Antes este nginx hacia de proxy hacia el gateway del EC2 y por eso todo era
    # mismo-origen. Hoy el navegador llama DIRECTAMENTE al API Gateway de AWS, y
    # es el API Gateway quien responde el preflight OPTIONS y agrega las
    # cabeceras Access-Control-*. Los origenes permitidos, los metodos y las
    # cabeceras habilitadas se configuran en la API (ver
    # backend/aws/api-gateway.yaml, seccion CorsConfiguration).
    #
    # Este servidor solo entrega los archivos estaticos del bundle de Vite.

    # index.html NUNCA se cachea: evita que el navegador quede con un bundle
    # viejo (ej. el que usaba redirectUri http://localhost:5173) tras un
    # despliegue. Siempre se descarga la ultima version.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    # Los assets con hash de Vite son inmutables: cache larga.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta sirve index.html
    location / {
        try_files $uri /index.html;
    }
}
