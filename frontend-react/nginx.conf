server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso hacia el API Gateway (EC2 backend). En el momento de
    # arrancar el contenedor se sustituye ${API_GATEWAY_URL} por la variable
    # de entorno (ej: http://3.15.200.5:8080). Como es mismo-origen, no hay CORS.
    location /api/ {
        proxy_pass ${API_GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta sirve index.html
    location / {
        try_files $uri /index.html;
    }
}