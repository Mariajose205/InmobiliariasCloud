server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permite subir propiedades con imagenes grandes (default es 1MB).
    client_max_body_size 50m;

    # Proxy reverso hacia el API Gateway (EC2 backend). En el momento de
    # arrancar el contenedor se sustituye ${API_GATEWAY_URL} por la variable
    # de entorno (ej: http://3.15.200.5:8080). Como es mismo-origen, no hay CORS.
    location /api/ {
        proxy_pass ${API_GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html NUNCA se cachea: evita que el navegador quede con un bundle
    # viejo (ej: el que usaba redirectUri http://localhost:5173) tras un
    # despliegue. Siempre se descarga la ultima version.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    # Los assets con hash de Vite son inmutables: cache larga.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta sirve index.html
    location / {
        try_files $uri /index.html;
    }
}