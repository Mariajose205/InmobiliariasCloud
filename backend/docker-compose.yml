# Despliegue del backend (microservicio + base de datos) en un EC2 usando
# imagenes desde Docker Hub.
#
# Ya no hay api-gateway: la API es el API Gateway (HTTP API) de AWS, definido
# en backend/aws/api-gateway.yaml. Este compose solo levanta PostgreSQL y el
# microservicio, que queda accesible solo desde API Gateway.
#
# Requiere un archivo .env en esta misma carpeta con las variables:
#   POSTGRES_DB=inmobiliarias
#   POSTGRES_USER=<usuario de la base>
#   POSTGRES_PASSWORD=<password de la base>
#   ADMIN_EMAIL=<correo del administrador en Entra ID>
#   ADMIN_OID=<objectId del administrador en Entra ID>
#   CORREDOR_EMAIL=<correo del corredor en Entra ID>
#   CORREDOR_OID=<objectId del corredor en Entra ID>
#
# En tu PC (construir y subir imagenes a Docker Hub):
#   docker compose build
#   docker compose push
#
# En el EC2 (descargar y levantar):
#   docker compose pull
#   docker compose up -d
#
# Nota: la base de datos PostgreSQL corre dentro del mismo EC2 (servicio "db")
# con un volumen Docker para persistir los datos entre reinicios. Las tablas se
# crean automaticamente la primera vez (ddl-auto: update) y DataSeeder inserta las
# propiedades demo. No requiere permisos RDS en AWS.
services:

  # PostgreSQL persistente (reemplaza a Amazon RDS).
  db:
    image: postgres:16-alpine
    container_name: inmobiliarias-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Santiago
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inmob-red

  # RabbitMQ: broker del flujo de informes (exchange fanout + direct, colas y
  # DLQ). El 5672 (AMQP) queda interno; el 15672 (consola) se publica SOLO para
  # administracion y deberia restringirse por Security Group en produccion.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: inmobiliarias-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      TZ: America/Santiago
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inmob-red

  # Servidor SMTP de desarrollo. Captura los correos de notificacion y de
  # entrega del PDF sin enviarlos a internet. UI en http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: inmobiliarias-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - inmob-red

  # Kafka en modo KRaft (sin Zookeeper): broker del flujo de lista de deseos
  # (wishlist-service). El puerto 9092 se publica para administracion y
  # deberia restringirse por Security Group en produccion.
  kafka:
    image: apache/kafka:3.9.0
    container_name: inmobiliarias-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_MIN_INSYNC_REPLICAS: 1
      TZ: America/Santiago
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kraft/combined
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inmob-red

  # El puerto 8081 se publica para que API Gateway lo alcance por el VPC Link.
  # El Security Group del EC2 debe dejar entrar el 8081 solo desde el VPC Link o
  # el NLB, nunca desde internet.
  #
  # ADMIN_* y CORREDOR_* son la identidad contra la que el microservicio resuelve
  # el rol de cada usuario. La validacion del token de Azure Entra ID la hace API
  # Gateway; aqui solo se decide que puede hacer cada rol.
  #
  # Ya no existen JWT_SECRET ni ADMIN_PASSWORD: ambos pertenecían al antiguo
  # api-gateway de Spring Boot, que emitia su propio JWT y que fue eliminado.
  #
  # Para atar el puerto a la IP privada del EC2 en vez de a todas sus interfaces:
  #   - "${BACKEND_PRIVATE_IP}:8081:8081"
  inmobiliaria-service:
    build: ./inmobiliaria-service
    image: mariacarrero/inmobiliaria-service:latest
    container_name: inmobiliaria-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Con ${VAR:-default} se evita que una variable vacia (por ejemplo, un
      # .env sin definir) deje a admin/corredor sin rol y provoque 403.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-administrador@inmobiliariaduoc.onmicrosoft.com}
      ADMIN_OID: ${ADMIN_OID:-5ce11c6e-c796-41eb-b8ed-1872878cd197}
      CORREDOR_EMAIL: ${CORREDOR_EMAIL:-Corredor@InmobiliariaDuoc.onmicrosoft.com}
      CORREDOR_OID: ${CORREDOR_OID:-0a73de94-2722-4221-836c-bd7f3af16980}
      # RabbitMQ del flujo de informes.
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      # Kafka del flujo de lista de deseos.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # SMTP para notificaciones y entrega del PDF.
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      INFORMES_DIR: /app/informes
      TZ: America/Santiago
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      # service_started (no service_healthy): el microservicio arranca aunque el
      # broker tarde o falle, porque reintenta la conexion en segundo plano. Asi
      # un problema de RabbitMQ no tumba el catalogo ni la API.
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - inmob-red

  # Microservicio de lista de deseos (wishlist). Consume Kafka para
  # notificaciones y usa SMTP (MailHog) para los correos.
  wishlist-service:
    build: ./wishlist-service
    image: mariacarrero/wishlist-service:latest
    container_name: wishlist-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      # Resumen de novedades: en vez de un correo por propiedad, el usuario
      # recibe UN correo cada NOTIF_UMBRAL propiedades acumuladas y, ademas,
      # un resumen diario con lo que quede pendiente (por defecto 20:00).
      NOTIF_UMBRAL: ${NOTIF_UMBRAL:-6}
      NOTIF_CRON: "${NOTIF_CRON:-0 0 20 * * *}"
      NOTIF_ZONA: ${NOTIF_ZONA:-America/Santiago}
      # Con ${VAR:-default} se evita que una variable vacia (por ejemplo, un
      # .env sin definir) deje a admin/corredor sin rol y provoque 403.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-administrador@inmobiliariaduoc.onmicrosoft.com}
      ADMIN_OID: ${ADMIN_OID:-5ce11c6e-c796-41eb-b8ed-1872878cd197}
      CORREDOR_EMAIL: ${CORREDOR_EMAIL:-Corredor@InmobiliariaDuoc.onmicrosoft.com}
      CORREDOR_OID: ${CORREDOR_OID:-0a73de94-2722-4221-836c-bd7f3af16980}
      TZ: America/Santiago
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - inmob-red

  # Consola web para inspeccionar topics y mensajes de Kafka.
  kafka-ui:
    image: provectus/kafka-ui:latest
    container_name: inmobiliarias-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: inmobiliarias
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092
      # KAFKA_CLUSTERS_0_ZOOKEEPER se omite: Kafka corre en modo KRaft.
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - inmob-red

networks:
  inmob-red:
    driver: bridge

volumes:
  pgdata:
  rabbitmq-data:
    name: inmobiliarias-rabbitmq-data
  kafka-data:
