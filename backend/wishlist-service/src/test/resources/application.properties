# Configuracion solo para tests.
#
# Los tests no levantan un broker Kafka real, asi que se desactiva el arranque
# de los contenedores de listeners y la creacion automatica de topics.
# Sin esto, los @KafkaListener intentan conectar a localhost:9092 y bloquean
# la ejecucion esperando reconexiones.
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false

# Los tests unitarios usan Mockito y la BD H2 en memoria ya viene de
# application.yml (jdbc:h2:mem:wishlist). No se necesita configuracion extra
# de datasource aqui, solo se deja operativo por defecto.
spring.datasource.url=jdbc:h2:mem:wishlist-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
