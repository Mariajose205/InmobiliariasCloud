  # -------------------------------------------------------------------------
  # Stage en $default: la URL publica no lleva segmento de stage, que queda
  # https://{apiId}.execute-api.{region}.amazonaws.com/api/propiedades
  # -------------------------------------------------------------------------
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${InmobiliariaApi}'
      RetentionInDays: !Ref AccessLogRetentionDays

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref InmobiliariaApi
      StageName: '$default'
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "routeKey":"$context.routeKey","path":"$context.path",
          "status":"$context.status","protocol":"$context.protocol",
          "responseLength":"$context.responseLength",
          "integrationError":"$context.integrationErrorMessage"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        DetailedMetricsEnabled: true

Outputs:

  ApiInvokeUrl:
    Description: >
      Base para VITE_API_BASE_URL en el frontend, sin barra final.
    Value: !Sub 'https://${InmobiliariaApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiInvokeUrl'

  AllowedOrigins:
    Description: Origenes permitidos por CORS, tal como quedaron desplegados.
    Value: !If
      - ConOrigenDev
      - !Sub '${AllowedOriginProd},${AllowedOriginDev}'
      - !Ref AllowedOriginProd

  VpcLinkId:
    Description: Id del VPC Link, por si hace falta modificarlo despues.
    Value: !Ref VpcLink

  BackendNlbDnsName:
    Description: >
      DNS interno del balanceador. Sirve para diagnÃ³stico: no se usa como
      IntegrationUri, porque API Gateway exige el ARN del listener.
    Value: !GetAtt BackendNlb.DNSName

  BackendListenerArn:
    Description: ARN del listener, que es lo que usan las integraciones privadas.
    Value: !Ref BackendListener

  WishlistNlbDnsName:
    Description: DNS interno del balanceador de wishlist (diagnostico).
    Value: !GetAtt WishlistNlb.DNSName

  WishlistListenerArn:
    Description: ARN del listener de wishlist, usado por las integraciones privadas.
    Value: !Ref WishlistListener

  ClienteUserPoolId:
    Description: User Pool de clientes publicos (Cognito).
    Value: !Ref ClienteUserPool
    Export:
      Name: !Sub '${AWS::StackName}-ClienteUserPoolId'

  ClienteUserPoolClientId:
    Description: App client publico (sin secreto) que usa la SPA.
    Value: !Ref ClienteUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-ClienteUserPoolClientId'

  ClienteCognitoIssuer:
    Description: Issuer que valida API Gateway para los tokens de clientes.
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${ClienteUserPool}'
    Export:
      Name: !Sub '${AWS::StackName}-ClienteCognitoIssuer'

