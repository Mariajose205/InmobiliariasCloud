  # -------------------------------------------------------------------------
  # Rutas.
  #
  # Las lecturas del catalogo son publicas, porque Home.jsx las pide sin sesion
  # iniciada, y por eso van con AuthorizationType NONE. El resto exige el token
  # con el scope delegado. El preflight OPTIONS lo responde API Gateway a partir
  # de CorsConfiguration, antes de evaluar la autorizacion, por eso no se
  # declaran rutas OPTIONS.
  # -------------------------------------------------------------------------
  RutaListarPropiedades:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: GET /api/propiedades
      Target: !Sub 'integrations/${MicroservicioGetPublicIntegration}'
      AuthorizationType: NONE

  RutaObtenerPropiedad:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: GET /api/propiedades/{id}
      Target: !Sub 'integrations/${MicroservicioGetPublicIntegration}'
      AuthorizationType: NONE

  RutaCrearPropiedad:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: POST /api/propiedades
      Target: !Sub 'integrations/${MicroservicioPostIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AzureEntraAuthorizer
      AuthorizationScopes:
        - !Ref AuthorizationScopeName
  RutaActualizarPropiedad:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: PUT /api/propiedades/{id}
      Target: !Sub 'integrations/${MicroservicioPutIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AzureEntraAuthorizer
      AuthorizationScopes:
        - !Ref AuthorizationScopeName
  RutaEliminarPropiedad:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: DELETE /api/propiedades/{id}
      Target: !Sub 'integrations/${MicroservicioDeleteIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AzureEntraAuthorizer
      AuthorizationScopes:
        - !Ref AuthorizationScopeName
  RutaAuditoria:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: GET /api/auditoria
      Target: !Sub 'integrations/${MicroservicioGetIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AzureEntraAuthorizer
      AuthorizationScopes:
        - !Ref AuthorizationScopeName
  RutaMe:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: GET /api/me
      Target: !Sub 'integrations/${MicroservicioGetIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AzureEntraAuthorizer
      AuthorizationScopes:
        - !Ref AuthorizationScopeName
  # -------------------------------------------------------------------------
  # Rutas del flujo asincrono de informes y de la administracion del broker.
  #
  # Se usa una ruta codiciosa {proxy+} por metodo para cubrir todos los
  # endpoints nuevos sin declarar uno por uno; el microservicio sigue aplicando
  # la matriz de permisos (el informe exige ADMIN o CORREDOR y /api/admin exige
  # ADMIN). Todas van con AuthorizationType JWT: el access token de Azure Entra
  # ID sigue siendo obligatorio, igual que en el resto de rutas privadas.
  # -------------------------------------------------------------------------
  RutaInformePdf:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: POST /api/informes/{proxy+}
      Target: !Sub 'integrations/${MicroservicioPostIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AzureEntraAuthorizer
      AuthorizationScopes:
        - !Ref AuthorizationScopeName

  RutaAdminGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: GET /api/admin/{proxy+}
      Target: !Sub 'integrations/${MicroservicioGetIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AzureEntraAuthorizer
      AuthorizationScopes:
        - !Ref AuthorizationScopeName

  RutaAdminPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: POST /api/admin/{proxy+}
      Target: !Sub 'integrations/${MicroservicioPostIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AzureEntraAuthorizer
      AuthorizationScopes:
        - !Ref AuthorizationScopeName

  RutaAdminDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: DELETE /api/admin/{proxy+}
      Target: !Sub 'integrations/${MicroservicioDeleteIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AzureEntraAuthorizer
      AuthorizationScopes:
        - !Ref AuthorizationScopeName
  # -------------------------------------------------------------------------
  # Rutas del wishlist-service (favoritos + novedades automaticas).
  #
  # OJO: estas rutas faltaban y por eso /api/wishlist/* devolvia 404 sin
  # CORS. Con ellas, el preflight lo sigue respondiendo CorsConfiguration
  # del API y la peticion llega a wishlist-service (8082) via su NLB.
  #
  # - GET /api/wishlist/comunas es publico (catalogo de comunas sin sesion,
  #   igual que el interceptor del servicio que lo permite sin identidad).
  # - El resto exige JWT; el servicio resuelve la identidad desde el token.
  # - /api/admin/kafka/* es mas especifica que /api/admin/{proxy+} y API
  #   Gateway la prefiere, asi que no choca con el admin RabbitMQ de
  #   inmobiliaria-service.
  # -------------------------------------------------------------------------
  RutaWishlistComunas:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InmobiliariaApi
      RouteKey: GET /api/wishlist/comunas
      Target: !Sub 'integrations/${WishlistGetPublicIntegration}'
      AuthorizationType: NONE

