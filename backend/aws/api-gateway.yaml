        overwrite:header.X-User-Oid: $context.authorizer.jwt.claims.sub
        overwrite:header.X-User-Name: $context.authorizer.jwt.claims.name
        overwrite:header.X-User-Rol: $context.authorizer.jwt.claims.rol

  ClientePostIntegration:
