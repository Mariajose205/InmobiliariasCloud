# Configuracion solo para tests.
#
# Los tests no levantan un broker RabbitMQ real, asi que se desactiva el arranque
# de los contenedores de listeners y la declaracion automatica del RabbitAdmin.
# Sin esto, los @RabbitListener intentan conectar a localhost:5672 y bloquean la
# ejecucion esperando reconexiones.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
