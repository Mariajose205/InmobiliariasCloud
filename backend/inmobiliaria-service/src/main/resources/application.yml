server:
  port: 8081
  # IMPORTANTE: el microservicio NO esta expuesto publicamente.
  # Solo escucha en la interfaz de loopback (local) del servidor.
  # El acceso publico se realiza unicamente a traves del API Gateway (puerto 8080).
  address: 127.0.0.1

spring:
  application:
    name: inmobiliaria-service
  datasource:
    url: jdbc:h2:mem:inmobiliarias;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      # H2 console habilitada solo para desarrollo local, accesible via loopback.
      enabled: true
      path: /h2-console
