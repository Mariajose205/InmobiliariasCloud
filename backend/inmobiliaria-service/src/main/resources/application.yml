server:
  port: 8081
  # IMPORTANTE: el microservicio NO esta expuesto publicamente.
  # Solo escucha en la interfaz de loopback (local) del servidor.
  # El acceso publico se realiza unicamente a traves del API Gateway de AWS,
  # que es quien valida el token de Azure Entra ID antes de reenviar la peticion.
  address: 127.0.0.1

spring:
  application:
    name: inmobiliaria-service
  datasource:
    url: jdbc:h2:mem:inmobiliarias;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      # H2 console habilitada solo para desarrollo local, accesible via loopback.
      enabled: true
      path: /h2-console
  # Conexion a RabbitMQ (en dev corre con Docker en localhost).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        # ACK automatico: el contenedor confirma al terminar el metodo sin
        # excepcion. Si el consumidor agota sus reintentos y lanza, el
        # contenedor rechaza sin requeue y el DLX mueve el mensaje a la DLQ.
        acknowledge-mode: auto
        # Un mensaje a la vez por consumidor para procesar el PDF con calma.
        prefetch: 1
        default-requeue-rejected: false
        # El retry del framework queda desactivado: cada consumidor reintenta
        # por su cuenta (Reintentos) y, al agotar, hace NACK(requeue=false)
        # para que el DLX mueva el mensaje a la DLQ correspondiente.
        retry:
          enabled: false
  # Conexion a Kafka (evento PropiedadCreada -> wishlist-service).
  # En Docker Compose el broker es el servicio "kafka" (KRaft, sin Zookeeper);
  # HOST implicito: kafka:9092. En dev local se antepone localhost por defecto.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Clave (key) = comuna normalizada (Quillota, Vina del Mar, ...).
      # Kafka enruta todos los mensajes de la misma comuna siempre a la misma
      # particion, lo que permite paralelismo sin ordenamiento cruzado.
      # Serializer: String para la clave (comuna) y JSON tipado para el valor.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      enable-idempotence: true
      properties:
        # JsonSerializer incluye el Tipo Java en el header; listar DTO permitidos.
        spring.json.trusted.packages: "cl.inmobiliarias.service.dto"
        spring.json.add.type.headers: true
    admin:
      # Los topicos (particiones/retencion/cleanup) se declaran en
      # KafkaNewTopicConfig. El admin los crea al arrancar el servicio.
      auto-create: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# ---------------------------------------------------------------------------
# Configuracion centralizada de la mensajeria (nombres de colas, exchanges,
# routing keys y DLQ). La consume RabbitProperties y la usan los @Bean de
# RabbitMqConfig, el productor y los consumidores, evitando literales sueltos.
# -----------------------------------------------------------------------------
rabbitmq:
  exchanges:
    # Exchange fanout que replica la solicitud inicial a todos los suscriptores.
    fanout: inmobiliaria.fanout
    # Exchange direct que enruta el trabajo de generacion de PDF.
    direct: inmobiliaria.direct
    # Exchange topic que enruta los eventos del dominio "propiedades" por
    # patron de routing key (propiedades.eventos.#).
    topic: inmobiliaria.topic
    # Dead Letter Exchanges (destino de mensajes fallidos).
    dlx: inmobiliaria.dlx
  queues:
    # Notificacion de que el pedido fue recibido y esta en proceso.
    correos-notificaciones: cola.correos.notificaciones
    # Generacion del informe PDF de propiedades.
    pdf-procesamiento: cola.pdf.procesamiento
    # Bitacora asincrona de eventos sobre propiedades (topic exchange).
    propiedades-auditoria: cola.propiedades.auditoria
    # Dead Letter Queues.
    correos-notificaciones-dlq: cola.correos.notificaciones.dlq
    pdf-procesamiento-dlq: cola.pdf.procesamiento.dlq
    propiedades-auditoria-dlq: cola.propiedades.auditoria.dlq
  routing-keys:
    # Ruta usada por el exchange direct para el trabajo de PDF.
    pdf: informe.pdf.generar
    # Routing keys del exchange topic por accion del dominio propiedades.
    propiedades-eventos-crear: propiedades.eventos.creada
    propiedades-eventos-editar: propiedades.eventos.editar
    propiedades-eventos-eliminar: propiedades.eventos.eliminar
    # Patron del binding topic -> cola de auditoria (wildcard multi-nivel).
    propiedades-eventos-patron: propiedades.eventos.#
    # Rutas de enrutado hacia las DLQ.
    correos-notificaciones-dlq: correos.notificaciones.dlq
    pdf-procesamiento-dlq: pdf.procesamiento.dlq
    propiedades-auditoria-dlq: propiedades.auditoria.dlq
  admin:
    # TTL de los mensajes en la DLQ (en ms); luego de eso expiran.
    dlq-ttl: 600000

# Topicos Kafka del flujo "nueva propiedad -> aviso por comuna"
# (ver DTO PropiedadCreadaEvent, KafkaNewTopicConfig y el microservicio
# wishlist-service en backend/wishlist-service).
app.kafka:
  topics:
    propiedades-nuevas: propiedades-nuevas
    notificaciones-sistema: notificaciones-sistema
    propiedades-nuevas-dlq: propiedades-nuevas.dlq
    notificaciones-sistema-dlq: notificaciones-sistema.dlq

informes:
  # Directorio donde el consumidor de PDF deja los informes generados.
  directorio: ${INFORMES_DIR:./informes}

seguridad:
  # En desarrollo local no hay API Gateway delante, asi que no se exige identidad.
  # En produccion esto se activa (ver application-prod.yml).
  autorizacion-requerida: false
  admin-email: administrador@inmobiliariaduoc.onmicrosoft.com
  admin-oid: 5ce11c6e-c796-41eb-b8ed-1872878cd197
  corredor-email: Corredor@InmobiliariaDuoc.onmicrosoft.com
  corredor-oid: 0a73de94-2722-4221-836c-bd7f3af16980
